<!DOCTYPE html>
<html lang="en">
<head>
  <title>Wedding Access</title>
  <meta charset="UTF-8">
  <meta name="description" content="Access Callum & Jade's wedding website with your invitation password." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../Global.css">
  <link rel="stylesheet" href="./Gatekeeper.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Bonheur+Royale&display=swap" rel="stylesheet">
</head>
<body> 
  <header>
    <h1>Callum & Jade's Wedding</h1>
    <h2 class="subtitle">Welcome to the website.<br>Please enter the password found on your invitation.</h2>
  </header>

  <div class="form">
      <label for="passwordInput">Invitation Password:</label>
      <input id="passwordInput" type="password" placeholder="Password" autocomplete="off"/>
      <hr>
      <button id="loginButton">Continue</button>
      
      <p id="error" class="error hidden">The password you entered is incorrect. Please try again with the exact password from your invitation.</p>
  </div>
  <script src="./Gatekeeper.js"></script>
</body>
</html>
