<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RSVP to Callum & Jade's wedding. Please confirm your attendance." />
  <title>Wedding RSVP</title>
  <link rel="stylesheet" href="./RSVP.css">
  <link rel="stylesheet" href="../Global.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Bonheur+Royale&display=swap" rel="stylesheet">
</head>
<body>
    <header>
      <h1>Callum & Jade's Wedding</h1>
      <h2 class="subtitle" >Please RSVP below</h2>
    </header>
    <form action="https://formspree.io/f/mwpgyrzq" method="POST" class="form" id="rsvpForm">

      <div id="section-guest-selection" class="section">
        <label>Select a Guest:</label>
        
        <!-- Day Guests -->
        <div data-guest-type="day">
          <div id="guest-dropdown">
            <details class="guest-category">
              <summary>Bride</summary>
              
              <details class="guest-category">
                <summary>Family</summary>
                <button type="button" data-guest="Allison, Jensen & Megan">Allison, Jensen & Megan</button>
                <button type="button" data-guest="Ethan">Ethan</button>
                <button type="button" data-guest="Jack & Penny">Jack & Penny</button>
                <button type="button" data-guest="Jennifer & Doug">Jennifer & Doug</button>
                <button type="button" data-guest="Jon & Michelle">Jon & Michelle</button>
                <button type="button" data-guest="Ken & Kelly">Ken & Kelly</button>
                <button type="button" data-guest="Teresa, Peter & Amy">Teresa, Peter & Amy</button>
                <button type="button" data-guest="Terry & Josie">Terry & Josie</button>
                <button type="button" data-guest="William & Jo">William & Jo</button>
                <button type="button" data-guest="Wun Lin & Dave">Wun Lin & Dave</button>
              </details>

                <details class="guest-category">
                  <summary>Friends</summary>
                  <button type="button" data-guest="Anna & Kieron">Anna & Kieron</button>
                </details>       
            </details>
            
            <details class="guest-category">
              <summary>Groom</summary>
              
              <details class="guest-category">
                <summary>Family</summary>
                  <button type="button" data-guest="Alan, Kelly & Seren">Alan, Kelly & Seren</button>
                  <button type="button" data-guest="Amanda">Amanda</button>
                  <button type="button" data-guest="Charlotte, Dom, Oscar, Rose & Violet">Charlotte, Dom, Oscar, Rose & Violet</button>
                  <button type="button" data-guest="Finley & Kieran">Finley & Kieran</button>
                  <button type="button" data-guest="Jordan, Ellie & Lucas">Jordan, Ellie & Lucas</button>
                  <button type="button" data-guest="Louise">Louise</button>
                  <button type="button" data-guest="Marguerite">Marguerite</button>
                  <button type="button" data-guest="Marion">Marion</button>
                  <button type="button" data-guest="Mark">Mark</button>
                  <button type="button" data-guest="Sue & Neil">Sue & Neil</button>
                  <button type="button" data-guest="Tony & Debbie">Tony & Debbie</button>
                </details>

                <details class="guest-category">
                  <summary>Friends</summary>
                  <button type="button" data-guest="Abdi">Abdi</button>
                  <button type="button" data-guest="Lauren">Lauren</button>
                  <button type="button" data-guest="Natasha">Natasha</button>
                  <button type="button" data-guest="Pedro">Pedro</button>
                </details>  
            </details>
          </div>
        </div>

        <!-- Evening Guests -->
        <div data-guest-type="evening" class="hidden">
          <div id="guest-dropdown-evening">
            <details class="guest-category">
              <summary>Bride</summary>
                <button type="button" data-guest="Dave">Dave</button>
                <button type="button" data-guest="Deborah & Mark">Deborah & Mark</button>
                <button type="button" data-guest="Laura & Ric">Laura & Ric</button>
                <button type="button" data-guest="Leigh & Vicki">Leigh & Vicki</button>
                <button type="button" data-guest="Melanie">Melanie</button>
                <button type="button" data-guest="Michelle, Simon & Charlotte">Michelle, Simon & Charlotte</button>
                <button type="button" data-guest="Michelle, Wayne & Sam">Michelle, Wayne & Sam</button>
                <button type="button" data-guest="Mona & Paul">Mona & Paul</button>
                <button type="button" data-guest="Natalie & Luke">Natalie & Luke</button>
                <button type="button" data-guest="Sam">Sam</button>
                <button type="button" data-guest="Sarah & Mike">Sarah & Mike</button>
                <button type="button" data-guest="Sarah & Tom">Sarah & Tom</button>
            </details>
            
            <details class="guest-category">
              <summary>Groom</summary>
                <button type="button" data-guest="Aaron & Nour">Aaron & Nour</button>
                <button type="button" data-guest="Chris & Wife">Chris & Wife</button>
                <button type="button" data-guest="Danny & Chloe">Danny & Chloe</button>
                <button type="button" data-guest="Felix & Beth">Felix & Beth</button>
                <button type="button" data-guest="Jacob">Jacob</button>
                <button type="button" data-guest="Joe">Joe</button>
                <button type="button" data-guest="Lauren & James">Lauren & James</button>
                <button type="button" data-guest="Natasha & Brandon">Natasha & Brandon</button>
                <button type="button" data-guest="Niall & Holly">Niall & Holly</button>
                <button type="button" data-guest="Sareena">Sareena</button>
            </details>
          </div>
        </div>
             
        <div id="selection-box">
        </div>   
        <hr>
      </div>

      <div id="section-attendance" class="section hidden">
        <label for="attendance">Will you be attending?</label>
        <select id="attendance" name="attendance">
          <option value="">Please select</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
        <hr>
      </div>

      <div id="section-guest-count" class="section hidden">
        <label for="guests">How many will be attending?</label>
        <input type="number" id="guests" name="guests" min="1" max="10">
        <hr>
      </div>

      <div id="section-allergies" class="section hidden">
        <label>Food Allergies/Dietary Requirements:</label>
        <div class="allergies-checkboxes">
          <label><input type="checkbox" name="allergies-item" value="none"> None</label>
          <label><input type="checkbox" name="allergies-item" value="vegetarian"> Vegetarian</label>
          <label><input type="checkbox" name="allergies-item" value="vegan"> Vegan</label>
          <label><input type="checkbox" name="allergies-item" value="gluten-free"> Gluten Free</label>
          <label><input type="checkbox" name="allergies-item" value="dairy-free"> Dairy Free</label>
          <label><input type="checkbox" name="allergies-item" value="nut-allergy"> Nut Allergy</label>
          <label><input type="checkbox" name="allergies-item" value="halal"> Halal</label>
          <label><input type="checkbox" name="allergies-item" value="shellfish-allergy"> Shellfish Allergy</label>
          <label><input type="checkbox" name="allergies-item" value="other"> Other (please specify)</label>
        </div>
        <input type="hidden" id="allergies" name="allergies" value="">
        <hr>
      </div>

      <div id="section-message" class="section">
        <label for="message">Leave us a message:</label>
        <textarea id="message" name="message" rows="4" placeholder=""></textarea>
        <hr>
      </div>

      <button type="submit">Send RSVP</button>
      
      <input type="hidden" name="_redirect" value="../index.html">
      <input type="hidden" id="guest" name="guest" required>
    </form>
  <footer>
    <p>We can’t wait to celebrate with you 💕</p>
  </footer>    
  <script src="../utils.js"></script>    <script src="./RSVP.js"></script>
</body>
</html>
